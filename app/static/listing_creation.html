<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        #create_listing {
            background-color: azure;
            border: 2px solid black;
            border-radius: 5px;
            padding: 15px;
            display: flex;
            gap: 5px;
            flex-direction: column;
            margin: 10px;
        }
    </style>
</head>

<body>
    <script src="/static/navbar.js"></script>
    <script src="/static/auth.js"></script>
    <div id="nav_placeholder"></div>




    <div id="create_listing">
        <label for="listing_title">Title:</label>
        <input type="text" id="listing_title">
        <label for="listing_description">Description:</label>
        <textarea id="listing_description" rows="8"> </textarea>
        <label for="listing_price">Price:</label>
        <input type="number" id="listing_price">
        <label for="listing_category">Category:</label>
        <select id="listing_category" name="Category">
            <option value="Home essentials">Home Essentials</option>
            <option value="Furnitures">Furnitures</option>
            <option value="Electronics">Electronics</option>
            <option value="Toys">Toyes</option>
        </select>

        <label for="listing_condition">Condition:</label>
        <select id="listing_condition" name="Condition">
            <option value="New">New</option>
            <option value="Used like new">Used like new</option>
            <option value="Used good">Used good</option>
            <option value="Used fair">Used fair</option>
        </select><br>

        <label for="images">Images</label>
        <input type="file" id="images" multiple>
        <button class="btn_primary" onclick="createListing()">Create new listing</button>

        <div id="error_message" style="color: red; margin-top: 10px;"></div>
    </div>


    <script>
        document.addEventListener('DOMContentLoaded', loadNavbar);

        function setErrorMessage(data) {

            let err = "";
            let error_container = document.getElementById("error_message");
            if (data.detail) {
                err = Array.isArray(data.detail)
                    ? data.detail.map(err => `${err.loc[1]}: ${err.msg}`).join(", ")
                    : data.detail;
            } else {
                err = "Something went wrong. Please try again.";
            }
            document.getElementById("error_message").textContent = err;
        }


        async function uploadImages(listing_id) {

            let formData = new FormData();
            const token = localStorage.getItem("token");
            let files = document.getElementById("images").files;
            for (let file of files) {
                formData.append("images", file);
            }
            const response = await fetch(`/listings/${listing_id}/upload_images`, {
                method: "POST",
                headers: {
                    "Authorization": "Bearer " + token
                },

                body: formData

            });

            const data = await response.json();
            if (response.ok) {
                return true;
            }
            else {
                console.log("Uploading images failed");
                setErrorMessage(data);
                return false;
            }
        }


        async function createListing() {
            const token = localStorage.getItem("token");

            const response = await fetch("/listings", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": "Bearer " + token
                },
                body: JSON.stringify({
                    title: document.getElementById("listing_title").value,
                    description: document.getElementById("listing_description").value,
                    price: Number(document.getElementById("listing_price").value),
                    category: document.getElementById("listing_category").value,
                    condition: document.getElementById("listing_condition").value
                })
            });

            const data = await response.json();

            if (response.ok) {
                let images_uploaded = await uploadImages(data.id);
                if (!images_uploaded) {
                    console.log("Uploading images failed");
                    return;
                }
                window.location.href = "/static/listings.html";
            } else {
                if (response.status == 401) {
                    window.location.replace("/static/login.html");
                }
                console.log("Create listing failed");
                setErrorMessage(data);

            }
        }


    </script>

</body>

</html>
