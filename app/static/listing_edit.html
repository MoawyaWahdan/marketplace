<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        #edit_listing {
            background-color: azure;
            border: 2px solid black;
            border-radius: 5px;
            padding: 15px;
            display: flex;
            gap: 5px;
            flex-direction: column;
            margin: 10px;
            max-width: 720px;
        }

        #images-container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .image-label {
            flex: 0 0 auto;
            display: flex;
            width: 150px;
            height: 150px;
            border-radius: 5px;
            background-color: #eee;
            cursor: pointer;
            align-items: center;
            justify-content: center;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            position: relative;
        }

        .delete-image {
            background-color: aqua;
            font-size: large;
            right: 10px;
            top: 10px;
            position: absolute;
            cursor: pointer;

        }

        .delete-image:hover {
            background-color: red;
        }

        input[type="file"] {
            display: none;
        }
    </style>
</head>

<body>
    <script src="/static/navbar.js"></script>
    <script src="/static/auth.js"></script>
    <div id="nav_placeholder"></div>

    <div id="edit_listing">
        <label for="listing_title">Title:</label>
        <input type="text" id="listing_title"><br>
        <label for="listing_description">Description:</label>
        <textarea id="listing_description" rows="8"> </textarea><br>
        <label for="listing_price">Price:</label>
        <input type="number" id="listing_price">
        <label for="listing_category">Category:</label>
        <select id="listing_category" name="Category">
            <option value="Home essentials">Home Essentials</option>
            <option value="Furnitures">Furnitures</option>
            <option value="Electronics">Electronics</option>
            <option value="Toys">Toyes</option>
        </select>

        <label for="listing_condition">Condition:</label>
        <select id="listing_condition" name="Condition">
            <option value="New">New</option>
            <option value="Used like new">Used like new</option>
            <option value="Used good">Used good</option>
            <option value="Used fair">Used fair</option>
        </select><br>

        <div id="images-container">
        </div>


    </div>
    <!-- <label for="images">Images</label>
        <input type="file" id="images" multiple> -->
    <button class="btn_primary" onclick="editListing()">Submit</button>


    <div id="error_message" style="color: red; margin-top: 10px;"></div>
    </div>


    <script>
        document.addEventListener('DOMContentLoaded', loadNavbar);


        fillCurrentValues();
        addNewImageLabel(0);
        addImagesHandler();

        function addImagesHandler() {

            let label_id = 1;
            let images_container = document.getElementById("images-container");

            function getId(id_str) {
                return id_str.slice(id_str.lastIndexOf('-') + 1)
            }
            function addDeleteButton(image_label) {
                let delete_span = document.createElement("span");
                delete_span.textContent = "X";
                delete_span.classList.add("delete-image");
                image_label.append(delete_span);
            }

            function addLabelBackgroundImage(image_label, file) {

                let imageUrl = URL.createObjectURL(file);
                image_label.style.backgroundImage = `url(${imageUrl})`;
                image_label.querySelector(".text").remove();

            }

            images_container.addEventListener("change", (event) => {
                let target = event.target.closest("input");
                if (!target || !images_container.contains(target)) {
                    return;
                }

                let image_label = document.getElementById("image-label-" + getId(target.id));
                const file = target.files[0];
                let old_background = image_label.style.backgroundImage;

                addLabelBackgroundImage(image_label, file);
                image_label.imageFile = file;

                // if the label backgroundset, then this is called only to change the image.
                if (old_background) {
                    return;
                }

                addDeleteButton(image_label);
                addNewImageLabel(label_id);

                label_id += 1;
            });


            images_container.addEventListener("click", (event) => {
                let target = event.target;
                if (!target.classList.contains("delete-image")) {
                    return;
                }
                let image_label = target.closest("label");
                if (!image_label || !images_container.contains(image_label)) {
                    return;
                }
                let input_file = document.getElementById("input-file-" + getId(image_label.id));
                image_label.remove();
                input_file.remove();

            });
        }



        function addNewImageLabel(label_id) {
            let images_container = document.getElementById("images-container");

            // 1- hidden input file 
            let input_file = document.createElement("input");
            input_file.type = "file";
            let input_file_id = "input-file-" + label_id;
            input_file.id = input_file_id;

            // 2- image label
            let image_label = document.createElement("label");
            image_label.htmlFor = input_file_id;
            image_label.classList.add("image-label");
            image_label.id = "image-label-" + label_id;
            image_label.innerHTML = "<span class='text'>Add photo +<span>";

            images_container.append(image_label, input_file);

        }
        function getSelectedListing() {
            const listing_id = localStorage.getItem("selected_listing");

            return JSON.parse(localStorage.getItem(`listing${listing_id}`));
        }

        function fillCurrentValues() {
            const listing = getSelectedListing();

            document.getElementById("listing_title").value = listing.title;
            document.getElementById("listing_description").value = listing.description;
            document.getElementById("listing_price").value = listing.price;
            document.getElementById("listing_category").value = listing.category;
            document.getElementById("listing_condition").value = listing.condition;
        }
        function setErrorMessage(data) {

            let err = "";
            let error_container = document.getElementById("error_message");
            if (data.detail) {
                err = Array.isArray(data.detail)
                    ? data.detail.map(err => `${err.loc[1]}: ${err.msg}`).join(", ")
                    : data.detail;
            } else {
                err = "Something went wrong. Please try again.";
            }
            document.getElementById("error_message").textContent = err;
        }


        async function deleteListingImages(listing_id, token) {

            const response = await fetch(`/listings/${listing_id}/images`, {
                method: "DELETE",
                headers: {
                    "Authorization": "Bearer " + token
                },

            });

            if (response.ok) {
                console.log("delete ok");
                return true;
            }
            else {
                console.log("Deleteing images failed");
                return false;
            }
        }

        async function uploadNewImages(listing_id, token) {

            let formData = new FormData();
            let labels = document.getElementById("images-container").querySelectorAll(".image-label");
            for (let label of labels) {
                if (label.imageFile) {
                    formData.append("images", label.imageFile);
                }
            }
            const response = await fetch(`/listings/${listing_id}/upload_images`, {
                method: "POST",
                headers: {
                    "Authorization": "Bearer " + token
                },

                body: formData

            });

            const data = await response.json();
            if (response.ok) {
                return true;
            }
            else {
                console.log("Uploading images failed");
                setErrorMessage(data);
                return false;
            }
        }

        async function editListing() {
            const listing_id = localStorage.getItem("selected_listing");
            const token = localStorage.getItem("token");

            console.log("editListing 1");
            if (!await deleteListingImages(listing_id, token)) {
                return false;
            }
            console.log("editListing 2");
            if (!await uploadNewImages(listing_id, token)) {
                return false;
            }
            console.log("editListing 3");
            const response = await fetch(`/listings/${listing_id}`, {
                method: "PATCH",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": "Bearer " + token
                },
                body: JSON.stringify({
                    title: document.getElementById("listing_title").value,
                    description: document.getElementById("listing_description").value,
                    price: Number(document.getElementById("listing_price").value),
                    category: document.getElementById("listing_category").value,
                    condition: document.getElementById("listing_condition").value
                })
            });

            const data = await response.json();

            if (response.ok) {
                window.location.href = "/static/my_listings.html";
            } else {
                if (response.status == 401) {
                    window.location.replace("/static/login.html");
                }
                console.log("Edit listing failed");
                setErrorMessage(data);

            }
        }


    </script>

</body>

</html>
