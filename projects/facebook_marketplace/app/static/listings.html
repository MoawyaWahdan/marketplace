<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        #my-listings-container {
            background-color: azure;
            padding: 5px;
            display: flex;
            flex-direction: column;
            gap: 15px;


        }

        #my-listings {
            padding: 0;
            margin: 0;
        }

        .my-listing {
            border: 1px solid #ccc;
            padding: 5px;
            border-radius: 5px;
            background-color: #fff;
            margin: 5px;
            list-style: none;
            display: flex;
            gap: 5px;


        }


        .listing-left {
            flex: 0 0 auto;
        }

        .listing-middle {
            flex: 1;
        }

        .listing-right {
            display: flex;
            flex: 0 0 auto;
            gap: 5px;
            align-items: flex-start;

        }

        .my-listing:hover {
            background-color: gainsboro;
        }

        .listing-thumbnail {
            width: 150px;
            height: 150px;
            border-radius: 5px;
            object-fit: cover;
            display: block;
        }

        .listing-button {
            background-color: aquamarine;
            cursor: pointer;
            border-radius: 10px;
            padding: 5px;
        }

        .listing-button:hover {
            background-color: red;

        }

        #search-input {
            max-width: 300px;
            border-radius: 30px;
            padding: 10px;
        }

        #create-listing {
            align-self: flex-start;
            background-color: aquamarine;
            cursor: pointer;
            border-radius: 10px;
            padding: 5px;
        }

        #create-listing:hover {
            background-color: red;

        }
    </style>
</head>

<body>
    <script src="/static/navbar.js"></script>
    <script src="/static/auth.js"></script>

    <div id="nav_placeholder"></div>

    <div id="my-listings-container">
        <button onclick="createListing()" id="create-listing">Create listing</button>
        <h3>Your listings</h3>
        <input type="text" id="search-input" placeholder="Search your listings">
        <ul id="my-listings">
        </ul>
    </div>


    <script>
        document.addEventListener('DOMContentLoaded', loadNavbar);
        loadListings();
        addListingsClickHandler();
        addSearchHandler();

        function addListingsClickHandler() {
            let my_listings_container = document.getElementById("my-listings-container");
            my_listings_container.addEventListener("click", (event) => {
                let button = event.target.closest("button");
                if (!button || !my_listings_container.contains(button)) {
                    return;
                }

                if (button.classList.contains("view_listing")) {
                    localStorage.setItem("selected_listing", button.dataset.listingId);
                    window.location.href = "./listing_viewer.html";
                }
                else if (button.classList.contains("edit_listing")) {
                    localStorage.setItem("selected_listing", button.dataset.listingId);
                    window.location.href = "./listing_edit.html";
                }
                else if (button.classList.contains("delete_listing")) {
                    deleteListing(button);
                }
            }

            );
        }

        function addSearchHandler() {
            let search_input = document.getElementById("search-input");
            let timer_id;
            search_input.addEventListener("input", (event) => {
                clearTimeout(timer_id);

                timer_id = setTimeout(loadListings, 300);

            });

        }
        async function deleteListing(delete_button) {

            const token = localStorage.getItem("token");
            const response = await fetch(`/listings/${delete_button.dataset.listingId}`, {
                method: "DELETE",
                headers: {
                    "Authorization": "Bearer " + token
                }
            });

            if (response.ok) {
                delete_button.closest("li").remove();
            }
        }

        async function fetchListings() {


            const token = localStorage.getItem("token");
            const container = document.getElementById("my-listings");
            const search_input = document.getElementById("search-input");

            let url = "";
            let url_params = new URLSearchParams();
            if (search_input.value) {
                url_params.append("title", search_input.value);
                url = `/listings/search/my?${url_params}`;
                console.log("url", url);
            }
            else {
                url = "/listings/my/selling/";

            }

            const response = await fetch(url, {
                method: "GET",
                headers: {
                    "Authorization": "Bearer " + token
                },
            });

            if (!response.ok) {
                console.log("resonse", response);
                if (response.status === 401) {
                    window.location.replace("/static/login.html");
                }
                container.textContent = "Failed to load listings";
                return [];
            }

            const listings = await response.json();

            return listings;
        }

        function clearListings() {
            document.getElementById("my-listings").innerHTML = "";
        }
        async function loadListings() {

            clearListings();

            const ListingButtonType = {
                VIEW: "View",
                EDIT: "Edit",
                DELETE: "Delete",
            };

            function addListingButton(id, type) {
                let button = document.createElement("button");
                button.dataset.listingId = id;
                button.classList.add("listing-button");

                switch (type) {
                    case ListingButtonType.VIEW:
                        button.textContent = "View";
                        button.classList.add("view_listing");
                        break;
                    case ListingButtonType.DELETE:
                        button.textContent = "Delete";
                        button.classList.add("delete_listing");
                        break;
                    case ListingButtonType.EDIT:
                        button.textContent = "Edit";
                        button.classList.add("edit_listing");
                        break;
                }
                return button;

            }

            function addListingThumbnail(listing) {

                let thumbnail = document.createElement("img");
                thumbnail.classList.add("listing-thumbnail");
                if (listing.images.length > 0) {
                    thumbnail.src = listing.images[0].url;
                }

                return thumbnail
            }

            function addListingText(listing) {

                const text = document.createElement("span");
                text.textContent = listing.title + " - $" + listing.price;
                return text;
            }
            function storeListing(listing) {
                localStorage.setItem(`listing${listing.id}`, JSON.stringify(listing));
            }

            const listings = await fetchListings();
            let my_listings = document.getElementById("my-listings");
            listings.forEach(listing => {
                const li = document.createElement("li");
                li.classList.add("my-listing");

                const listing_left = document.createElement("div");
                listing_left.classList.add("listing-left");
                li.append(listing_left);

                const listing_middle = document.createElement("div");
                listing_middle.classList.add("listing-middle");
                li.append(listing_middle);

                const listing_right = document.createElement("div");
                listing_right.classList.add("listing-right");
                li.append(listing_right);


                storeListing(listing);
                listing_left.append(addListingThumbnail(listing));
                listing_middle.append(addListingText(listing));
                listing_right.append(addListingButton(listing.id, ListingButtonType.VIEW));
                listing_right.append(addListingButton(listing.id, ListingButtonType.EDIT));
                listing_right.append(addListingButton(listing.id, ListingButtonType.DELETE));

                my_listings.append(li);
            });
        }


        function createListing() {
            window.location.href = "./listing_creation.html";
        }
    </script>

</body>

</html>
