<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        #my-listings-container {
            background-color: azure;
            padding: 5px;
            display: flex;
            flex-direction: column;
            margin: 5px;

        }


        .my-listing {
            border: 1px solid #ccc;
            padding: 5px;
            border-radius: 5px;
            background-color: #fff;
            margin: 5px;
            list-style: none;
            display: flex;
            gap: 5px;

        }


        .listing-left {
            flex: 0 0 auto;
        }

        .listing-middle {
            flex: 1;
        }

        .listing-right {
            display: flex;
            flex: 0 0 auto;
            gap: 5px;
            align-items: flex-start;

        }

        .my-listing:hover {
            background-color: gainsboro;
        }

        .listing-thumbnail {
            width: 150px;
            height: 150px;
            border-radius: 5px;
            object-fit: cover;
            display: block;
        }

        .listing-button {
            background-color: aquamarine;
        }

        .listing-button:hover {
            background-color: gainsboro;
        }
    </style>
</head>

<body>
    <script src="/static/navbar.js"></script>
    <script src="/static/auth.js"></script>

    <div id="nav_placeholder"></div>
    <div>
        <button class="btn_secondary" onclick="createListing()">Create new listing</button>
    </div>
    <div id="my-listings-container">
        <h3>Your listings</h3>
        <ul id="my-listings">
        </ul>
    </div>


    <script>
        document.addEventListener('DOMContentLoaded', loadNavbar);
        loadListings();

        let my_listings_container = document.getElementById("my-listings-container");

        my_listings_container.addEventListener("click", (event) => {
            let button = event.target.closest("button");
            if (!button || !my_listings_container.contains(button)) {
                return;
            }

            if (button.classList.contains("view_listing")) {
                localStorage.setItem("selected_listing", button.dataset.listingId);
                window.location.href = "./listing_viewer.html";
            }

            else if (button.classList.contains("delete_listing")) {
                deleteListing(button);
            }
        }

        );

        async function deleteListing(delete_button) {

            const token = localStorage.getItem("token");
            const response = await fetch(`/listings/${delete_button.dataset.listingId}`, {
                method: "DELETE",
                headers: {
                    "Authorization": "Bearer " + token
                }
            });

            let li = delete_button.closest("li");
            li.remove();
        }

        async function loadListings() {

            async function fetchListings() {
                const token = localStorage.getItem("token");
                const container = document.getElementById("my-listings");

                const response = await fetch("/listings/my/selling/", {
                    method: "GET",
                    headers: {
                        "Authorization": "Bearer " + token
                    }
                });

                if (!response.ok) {
                    console.log("resonse", response);
                    if (response.status == 401) {
                        window.location.replace("/static/login.html");
                    }
                    container.textContent = "Failed to load listings";
                    return [];
                }

                const listings = await response.json();

                return listings;
            }


            const ListingButtonType = {
                VIEW: "View",
                DELETE: "Delete",
            };

            function addListingButton(id, type) {
                let button = document.createElement("button");
                button.dataset.listingId = id;
                button.classList.add("listing-button");

                switch (type) {
                    case ListingButtonType.VIEW:
                        button.textContent = "View";
                        button.classList.add("view_listing");
                        break;
                    case ListingButtonType.DELETE:
                        button.textContent = "Delete";
                        button.classList.add("delete_listing");
                }
                return button;

            }

            function addListingThumbnail(listing) {

                let thumbnail = document.createElement("img");
                thumbnail.classList.add("listing-thumbnail");
                if (listing.images.length > 0) {
                    thumbnail.src = listing.images[0].url;
                }

                return thumbnail
            }

            function addListingText(listing) {

                const text = document.createElement("span");
                text.textContent = listing.title + " - $" + listing.price;
                return text;
            }
            function storeListing(listing) {
                localStorage.setItem(`listing${listing.id}`, JSON.stringify(listing));
            }

            const listings = await fetchListings();
            let my_listings = document.getElementById("my-listings");
            listings.forEach(listing => {
                const li = document.createElement("li");
                li.classList.add("my-listing");

                const listing_left = document.createElement("div");
                listing_left.classList.add("listing-left");
                li.append(listing_left);

                const listing_middle = document.createElement("div");
                listing_middle.classList.add("listing-middle");
                li.append(listing_middle);

                const listing_right = document.createElement("div");
                listing_right.classList.add("listing-right");
                li.append(listing_right);


                storeListing(listing);
                listing_left.append(addListingThumbnail(listing));
                listing_middle.append(addListingText(listing));
                listing_right.append(addListingButton(listing.id, ListingButtonType.VIEW));
                listing_right.append(addListingButton(listing.id, ListingButtonType.DELETE));

                my_listings.append(li);
            });
        }


        function createListing() {
            window.location.href = "./listing_creation.html";
        }
    </script>

</body>

</html>
