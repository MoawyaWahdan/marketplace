<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        /* The parent container */
        #my_listings_container {
            background-color: azure;
            padding: 5px;
            display: flex;
            flex-direction: column;

            margin: 5px;
        }

        #my_listings_container ul {
            padding: 0;
            margin: 0;
            list-style: none;
            /* Moves this here to ensure the ul ignores bullets */
        }

        /* Decoration for the individual items */
        .my-listing {
            border: 1px solid #ccc;
            padding: 5px;
            list-style: none;
            border-radius: 5px;
            background-color: #fff;
            margin: 5px;


            /* Remove margin: 10px; the 'gap' above handles this now */
            box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.05);
            /* Optional: adds a tiny bit of depth */
        }

        .my-listing:hover {
            background-color: gainsboro;
        }
    </style>
</head>

<body>
    <script src="/static/navbar.js"></script>
    <script src="/static/auth.js"></script>

    <div id="nav_placeholder"></div>
    <div>
        <button class="btn_secondary" onclick="createListing()">Create new listing</button>
    </div>
    <div id="my_listings_container">

        <h3 style="font-family: 'Helvetica', sans-serif">Your listings</h3>
        <ul id="my_listings">
        </ul>
    </div>


    <script>
        document.addEventListener('DOMContentLoaded', loadNavbar);

        loadListings();



        async function loadListings() {
            const token = localStorage.getItem("token");
            const container = document.getElementById("my_listings");



            const response = await fetch("/listings", {
                method: "GET",
                headers: {
                    "Authorization": "Bearer " + token
                }
            });

            if (!response.ok) {
                container.textContent = "Failed to load listings";
                return;
            }

            const listings = await response.json();

            container.textContent = "";

            listings.forEach(listing => {
                const li = document.createElement("li");
                console.log("listing type = ", typeof (listing));
                li.textContent = listing.title + " - $" + listing.price;
                li.classList.add("my-listing");

                container.appendChild(li);
            });
        }

        async function createListing() {
            window.location.href = "./listing_creation.html";
        }
    </script>

</body>

</html>
