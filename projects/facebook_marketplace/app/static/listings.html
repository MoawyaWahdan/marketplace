<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        /* The parent container */
        #my_listings_container {
            background-color: azure;
            padding: 5px;
            display: flex;
            flex-direction: column;

            margin: 5px;
        }

        #my_listings_container ul {
            padding: 0;
            margin: 0;
            list-style: none;
            /* Moves this here to ensure the ul ignores bullets */
        }

        /* Decoration for the individual items */
        .my-listing {
            border: 1px solid #ccc;
            padding: 5px;
            list-style: none;
            border-radius: 5px;
            background-color: #fff;
            margin: 5px;

            display: flex;
            justify-content: space-between;
            /* Remove margin: 10px; the 'gap' above handles this now */


        }

        .my-listing:hover {
            background-color: gainsboro;
        }

        .listing_thumbnail {
            width: 150px;
            height: 150px;
        }
    </style>
</head>

<body>
    <script src="/static/navbar.js"></script>
    <script src="/static/auth.js"></script>

    <div id="nav_placeholder"></div>
    <div>
        <button class="btn_secondary" onclick="createListing()">Create new listing</button>
    </div>
    <div id="my_listings_container">

        <h3 style="font-family: 'Helvetica', sans-serif">Your listings</h3>
        <ul id="my_listings">
        </ul>
    </div>


    <script>
        document.addEventListener('DOMContentLoaded', loadNavbar);
        loadListings();

        let my_listings_container = document.getElementById("my_listings_container");

        my_listings_container.addEventListener("click", (event) => {
            let button = event.target.closest("button");
            if (!button || !my_listings_container.contains(button)) {
                return;
            }

            if (button.classList.contains("view_listing")) {
                localStorage.setItem("selected_listing", button.dataset.listingId);
                window.location.href = "./listing_viewer.html";
            }

            else if (button.classList.contains("delete_listing")) {
                deleteListing(button);
            }
        }

        );

        async function deleteListing(delete_button) {

            const token = localStorage.getItem("token");
            const response = await fetch(`/listings/${delete_button.dataset.listingId}`, {
                method: "DELETE",
                headers: {
                    "Authorization": "Bearer " + token
                }
            });

            let li = delete_button.closest("li");
            li.remove();
        }

        async function loadListings() {
            const token = localStorage.getItem("token");
            const container = document.getElementById("my_listings");
            container.textContent = "";

            async function fetchListings() {

                const response = await fetch("/listings/my/selling/", {
                    method: "GET",
                    headers: {
                        "Authorization": "Bearer " + token
                    }
                });

                if (!response.ok) {
                    console.log("resonse", response);
                    if (response.status == 401) {
                        window.location.replace("/static/login.html");
                    }
                    container.textContent = "Failed to load listings";
                    return [];
                }

                const listings = await response.json();

                return listings;
            }


            const ListingButtonType = {
                VIEW: "View",
                DELETE: "Delete",
            };

            function createListingButton(id, type) {
                let button = document.createElement("button");
                button.dataset.listingId = id;

                switch (type) {
                    case ListingButtonType.VIEW:
                        button.textContent = "View";
                        button.classList.add("view_listing");
                        break;
                    case ListingButtonType.DELETE:
                        button.textContent = "Delete";
                        button.classList.add("delete_listing");
                }
                return button;

            }

            function createListingThumbnail(listing) {

                let thumbnail = document.createElement("img");
                thumbnail.classList.add("listing_thumbnail");
                if (listing.images.length > 0) {
                    thumbnail.src = listing.images[0].url;
                }

                return thumbnail
            }

            function createListingText(listing) {

                const text = document.createElement("span");
                text.textContent = listing.title + " - $" + listing.price;
                return text;
            }
            function storeListing(listing) {
                localStorage.setItem(`listing${listing.id}`, JSON.stringify(listing));
            }

            listings = await fetchListings();
            listings.forEach(listing => {
                const li = document.createElement("li");
                li.classList.add("my-listing");
                storeListing(listing);
                li.append(createListingThumbnail(listing));
                li.append(createListingText(listing));
                li.append(createListingButton(listing.id, ListingButtonType.VIEW));
                li.append(createListingButton(listing.id, ListingButtonType.DELETE));

                container.append(li);
            });
        }


        function createListing() {
            window.location.href = "./listing_creation.html";
        }
    </script>

</body>

</html>
